# The hub on a server: the hub, its Redis, and (with --profile tunnel) a Cloudflare tunnel that gives it its public
# address without opening a port. deploy/update.sh keeps it on the newest main.
#
# On the server:
#   /etc/binders/hub.env     the hub's settings: PUBLIC_URL at least (see hub/src/main.ts)
#   /etc/binders/tunnel.env  TUNNEL_TOKEN, for the tunnel
#   /var/lib/binders         the hub's data (hub/) and Redis's (redis/); BINDERS_DATA moves it

name: binders

services:
  redis:
    image: redis:8.8-alpine
    # Every change is appended to disk: the change log holds the last seconds of changes, until the hub saves its state.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "", "--dir", "/data"]
    volumes:
      - ${BINDERS_DATA:-/var/lib/binders}/redis:/data
    # On the server itself only, for moving a hub's data in over SSH (deploy/move.sh).
    ports:
      - 127.0.0.1:6379:6379
    restart: unless-stopped

  hub:
    image: binders-hub
    build:
      context: ..
      target: hub
      # The commit it's built from (deploy/update.sh sets them), for Settings → This hub.
      args:
        COMMIT: ${BINDERS_COMMIT:-}
        COMMIT_SUBJECT: ${BINDERS_COMMIT_SUBJECT:-}
        REPO_URL: ${BINDERS_REPO_URL:-}
    env_file: ${BINDERS_ETC:-/etc/binders}/hub.env
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ${BINDERS_DATA:-/var/lib/binders}/hub:/app/hub/.data
    depends_on:
      - redis
    restart: unless-stopped
    # Time to save its state when it's stopped (Docker's default is 10 seconds).
    stop_grace_period: 90s
    # Time to start: the hub says it's ready once every Binder has started, which a hub with many takes a while to. The image's own check gives it about a minute.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4400/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 600s

  tunnel:
    image: cloudflare/cloudflared:2026.5.2
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file: ${BINDERS_ETC:-/etc/binders}/tunnel.env
    depends_on:
      - hub
    restart: unless-stopped
    profiles: [tunnel]
