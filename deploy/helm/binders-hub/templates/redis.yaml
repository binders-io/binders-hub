{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hub.fullname" . }}-redis
  labels: {{- include "hub.labelsWith" (list . (dict "app.kubernetes.io/component" "redis")) | nindent 4 }}
spec:
  serviceName: {{ include "hub.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "hub.selector" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels: {{- include "hub.podLabels" (list . (dict "app.kubernetes.io/component" "redis")) | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      {{- with include "hub.imagePullSecrets" . }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # Every change appended to disk, flushed each second.
          args: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "", "--dir", "/data"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          {{- with .Values.redis.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.redis.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hub.fullname" . }}-redis
  labels: {{- include "hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    {{- include "hub.selector" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
