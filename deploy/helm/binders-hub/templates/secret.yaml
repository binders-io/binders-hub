{{- if not .Values.hubSecret.existingSecret }}
{{- $name := include "hub.secretName" . }}
{{- $kept := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "hub.labels" . | nindent 4 }}
  annotations:
    # Kept when the release is uninstalled: it seals the hub's GitHub keys.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.hubSecret.value }}
  {{ .Values.hubSecret.key }}: {{ .Values.hubSecret.value | b64enc | quote }}
  {{- else if and $kept (index $kept.data .Values.hubSecret.key) }}
  {{ .Values.hubSecret.key }}: {{ index $kept.data .Values.hubSecret.key | quote }}
  {{- else }}
  {{ .Values.hubSecret.key }}: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
{{- end }}
