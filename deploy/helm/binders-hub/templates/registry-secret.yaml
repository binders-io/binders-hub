{{- with .Values.imageCredentials }}
{{- if .registry }}
{{- if not (and .username .password) }}{{ fail "imageCredentials needs a username and a password with its registry." }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-registry" (include "hub.fullname" $) }}
  labels: {{- include "hub.labels" $ | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict .registry (dict "username" .username "password" .password "email" .email "auth" (printf "%s:%s" .username .password | b64enc))) | toJson | b64enc | quote }}
{{- end }}
{{- end }}
